<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="google-site-verification" content="DyNYnuG9kw3CeiLEwsTD4IBQ7tUuhYpFHNYCWFPiN3Q" />
    <meta name="description" content="汉谚混写·국한문혼용체——在线将韩文转换为汉谚混写，支持汉字词源、注音对照和词典查询。한국어를 국한문혼용체로 변환하고 한자 어원·독음 대조·사전 검색을 지원합니다." />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉谚混写·국한문혼용체</title>
    <script src="/static/category_i18n.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header>
        <div class="brand">
            <h1 id="brand-title">汉谚混写·국한문혼용체</h1>
        </div>
        <div class="controls">
            <select id="language-select" class="language-select" aria-label="界面语言">
                <option value="zh">简体中文</option><option value="ko">한국어</option>
                <option value="en">English</option><option value="ja">日本語</option>
                <option value="fr">Français</option><option value="es">Español</option>
                <option value="ru">Русский</option><option value="vi">Tiếng Việt</option>
                <option value="mn">Монгол</option><option value="ar">العربية</option>
                <option value="th">ไทย</option><option value="id">Bahasa Indonesia</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div class="content-area">
            <div class="input-section">
                <div class="input-wrap">
                    <textarea id="text-input" maxlength="20000"></textarea>
                    <div class="input-actions">
                        <button id="btn-clear" class="btn-clear">清空</button>
                    </div>
                </div>
            </div>

            <div class="result-toolbar" id="result-toolbar">
                <button id="btn-layout"><span class="mode-option active" data-mode="aligned">注音</span><span class="mode-separator">/</span><span class="mode-option" data-mode="mixed">汉谚混写</span><span class="mode-separator">/</span><span class="mode-option" data-mode="original">原文</span></button>
                <button id="btn-etym">词源</button>
                <button id="btn-copy">复制</button>
                <button id="btn-show-spaces">显示空格</button>
                <button id="btn-highlight" class="active-on" aria-pressed="true">突出显示</button>
            </div>

            <div class="result-section reading-text" id="result-area"></div>
        </div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title-bar">
                    <h3 id="sidebar-title">词典搜索与详情</h3>
                    <button class="sidebar-close" id="btn-close-sidebar" title="Close sidebar">✕</button>
                </div>
                <div class="search-box">
                    <select id="search-type">
                        <option value="written_form">词条</option>
                        <option value="origin">原语</option>
                        <option value="entry_id">ID</option>
                    </select>
                    <input type="text" id="search-input" placeholder="사전 검색...">
                    <button id="btn-search" class="btn-primary">검색</button>
                </div>
            </div>
            <div class="sidebar-content" id="sidebar-content">
                <div id="sidebar-empty" style="color: var(--text-muted); text-align: center; margin-top: 50px; font-size: 0.95rem;">
                    点击正文中的词语，或使用上方搜索框查询词典。
                </div>
            </div>
        </aside>
    </div>

    <footer id="main-footer">
        <div class="footer-desktop-legend legend">
            <span class="legend-item"><i class="legend-swatch legend-converted"></i><span id="legend-converted">橙色：已可靠转换</span></span>
            <span class="legend-item"><i class="legend-swatch legend-ambiguous"></i><span id="legend-ambiguous">蓝色：存在歧义，需选择候选</span></span>
        </div>
        <div class="footer-stats" id="footer-stats">
            <span id="char-count" class="footer-stat-item">0字</span>
            <span class="footer-sep">·</span>
            <span id="convert-status" class="footer-stat-item">就绪</span>
            <span class="footer-sep footer-time-sep">·</span>
            <span id="proc-time" class="footer-stat-item footer-time-item">—</span>
        </div>
        <div class="footer-links">
            <a href="https://github.com/Arrow36/Hangul-Hanja-mixed-script" target="_blank" rel="noopener" class="footer-author-link">@Arrow36</a>
            <a id="dictionary-json-link" href="https://krdict.korean.go.kr/download/downloadPopup" target="_blank" rel="noopener" class="footer-dict-link">JSON 词典数据</a>
            <button id="btn-info-modal" class="btn-info-modal" aria-label="查看图例与词典信息" title="查看图例与词典信息">ⓘ</button>
        </div>
    </footer>

    <!-- Info Modal -->
    <div id="info-modal" class="modal-backdrop" style="display:none;" aria-hidden="true">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-header">
                <h3 id="modal-title">信息与说明</h3>
                <button id="btn-close-modal" class="modal-close" aria-label="关闭">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-section">
                    <h4 id="modal-legend-title">图例说明</h4>
                    <div class="modal-legend-list">
                        <div class="legend-item"><i class="legend-swatch legend-converted"></i><span id="modal-legend-converted">橙色：已可靠转换</span></div>
                        <div class="legend-item"><i class="legend-swatch legend-ambiguous"></i><span id="modal-legend-ambiguous">蓝色：存在歧义，需选择候选</span></div>
                    </div>
                </div>
                <div class="modal-section">
                    <h4 id="modal-dict-title">词典数据</h4>
                    <p id="modal-dict-date">JSON 词典数据</p>
                    <p style="margin-top:4px;"><a href="https://krdict.korean.go.kr/download/downloadPopup" target="_blank" rel="noopener" id="modal-dict-link">前往国立国语院下载页面 ↗</a></p>
                </div>
                <div class="modal-section" id="modal-time-section">
                    <h4 id="modal-time-title">处理耗时</h4>
                    <p id="modal-time-val">—</p>
                </div>
                <div class="modal-section">
                    <h4 id="modal-author-title">关于项目</h4>
                    <p>作者：<a href="https://github.com/Arrow36" target="_blank" rel="noopener">@Arrow36</a></p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast">已复制</div>

    <script src="/static/requests.js"></script>
    <script src="/static/languages.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
